name: CI

on:
  pull_request:
    branches: [stage, main]
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 진행 중이던 CI를 취소해 최신 커밋만 검증한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # DB가 필요 없는 정적 검사(biome + tsc)는 한 잡에서 순차로, 아래 DB 잡들과 병렬로 돈다.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hd_cms_prototype
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d hd_cms_prototype"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/hd_cms_prototype
      PAYLOAD_SECRET: ci-local-secret
      # 빈 CI postgres에 부팅 시 스키마를 생성하도록 dev-push 활성 (테스트 전용)
      PAYLOAD_DB_PUSH: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:int

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hd_cms_prototype
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d hd_cms_prototype"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/hd_cms_prototype
      PAYLOAD_SECRET: ci-local-secret
      # prerender가 Payload를 조회하므로 committed migration으로 빈 DB를 먼저 준비한다.
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run migrate
      # Next 빌드 캐시를 재사용해 재빌드를 가속한다. 소스가 바뀌면 restore-keys로 이전 캐시를 물려받는다.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - run: pnpm run build

  # 마이그레이션 체인이 "빈 DB에서 처음부터" 끝까지 도는지 검증하는 가드레일.
  # push 없이 실제 migrate만 돌려 order 0 no-op·코어 테이블 누락 같은 재현 불가 문제를 PR에서 잡는다.
  # (기존 test/build는 push로 스키마를 세워 이 결함을 못 잡았음 — 이 잡이 그 사각을 메운다.)
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hd_cms_prototype
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d hd_cms_prototype"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/hd_cms_prototype
      PAYLOAD_SECRET: ci-local-secret
      # push를 켜지 않는다 — 마이그레이션 체인만으로 빈 DB에 스키마가 서는지 보는 게 목적.
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run migrate
      - run: pnpm run migrate:status

  # 브랜치 보호의 required status check 이름을 `checks`로 안정적으로 유지하기 위한 집계 게이트.
  # 위 잡들을 병렬로 기다렸다가 하나라도 실패/취소면 실패한다. 잡을 더 쪼개도 이 이름만 required로 걸면 된다.
  checks:
    if: always()
    needs: [static, test, build, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.migrate.result }}" != "success" ]; then
            echo "CI 잡 실패: static=${{ needs.static.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} migrate=${{ needs.migrate.result }}"
            exit 1
          fi
          echo "모든 CI 잡 통과"
