name: Deploy migrations

on:
  push:
    branches: [stage, main]
    paths:
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-migrations-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == 'stage' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      # GitHub environment 이름: main → production, stage → stage
      name: ${{ github.ref_name == 'main' && 'production' || 'stage' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:status
      - run: pnpm migrate
      - run: pnpm migrate:status
